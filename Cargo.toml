[package]
name = "catbath"
version = "0.1.0"
edition = "2024"
authors = ["Lazy Senior Dev"]
description = "Full efficient graphic text editor: TUI (main), GUI/Web placeholders. Single binary <1MB optimized. Useful basic editor with search, undo, mouse."

[dependencies]
crossterm = "0.28"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
