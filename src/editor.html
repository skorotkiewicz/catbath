<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>editor: {fname}</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:monospace;height:100vh;display:flex;flex-direction:column}
textarea{flex:1;border:0;outline:0;background:#111;color:#eee;}
</style>
</head>
<body>
<div style="padding:5px 10px;background:#222">
<b>editor</b> - {fname}
<button onclick="doSave()" style="margin-left:10px">Save</button>
<button onclick="runExt('F1')">F1</button>
<button onclick="runExt('F2')">F2</button>
<span style="color:#888;font-size:12px" id="saved">(ctrl+e to save)</span>
</div>
<textarea id="ed" spellcheck="false">
{content}</textarea>
<script>
const ed=document.getElementById('ed');
const st=document.getElementById('saved');
let savedText=ed.value;
async function doSave(){
const input=ed.value;
st.textContent='saving...';
try {
const res=await fetch('/save',{method:'POST',headers:{'X-Catbath':'1'},body:input});
if(!res.ok) throw new Error(await res.text());
savedText=input;
st.textContent=ed.value===input?'saved':'saved earlier version; unsaved changes remain';
} catch(error) {
st.textContent='save failed: '+error.message;
}
}
window.addEventListener('beforeunload',e=>{
if(ed.value!==savedText){e.preventDefault();e.returnValue='';}
});
document.addEventListener('keydown',e=>{
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){
e.preventDefault();
doSave();
}
});
function runExt(key) {
const input = ed.value;
st.textContent = 'running ' + key + '...';
fetch('/ext/' + key, {method:'POST', headers:{'X-Catbath':'1'}, body: input})
.then(res => {
if (!res.ok) return res.text().then(message=>{throw new Error(message);});
return res.text();
})
.then(newText => {
if (ed.value !== input) {
st.textContent = key + ' done; buffer changed';
return;
}
const changed = newText !== input;
ed.value = newText;
st.textContent = changed ? key + ' applied' : key + ' returned no changes';
})
.catch(error => {
st.textContent = 'extension failed: '+error.message;
});
}
</script>
</body></html>
